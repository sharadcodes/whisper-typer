# Use this to run faster-whisper with an NVIDIA GPU.
# Requires: Docker with NVIDIA Container Toolkit installed.
# Run: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
services:
  faster-whisper:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
