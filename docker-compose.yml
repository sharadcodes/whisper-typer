services:
  faster-whisper:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - WHISPER_MODEL=${WHISPER_MODEL:-tiny}
      secrets:
        - hf_token
    container_name: faster-whisper
    env_file:
      - .env
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - WHISPER_MODEL=${WHISPER_MODEL:-tiny}
    volumes:
      - ./models:/config # Mount local models directory into container
    ports:
      - 8000:8000   # FastAPI /transcribe
    restart: unless-stopped

secrets:
  hf_token:
    environment: HF_TOKEN